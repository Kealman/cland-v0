# Project staffing policy; role definitions and harness defaults live in roles.toml.
leads = []
idle_from = []

[crew.coordinator]
policy = "singleton"
size = 1
keep_context = false
stop_after = "never"
subagents = true
heartbeat = "1h"

[crew.lead]
policy = "per-item"
keep_context = false
stop_after = "never"
subagents = true
# heartbeat = "off" # (default)

[crew.implementer]
policy = "per-item"
keep_context = false
stop_after = "merge"
subagents = false
# heartbeat = "off" # (default)

[crew.reviewer]
policy = "pool"
# Raised from 2 by the human on 2026-10-15 (ask 0727b3c8): review was the bottleneck.
size = 4
keep_context = true
stop_after = "never"
subagents = false
# heartbeat = "off" # (default)

[crew.qa]
policy = "singleton"
size = 1
keep_context = false
stop_after = "never"
subagents = false
# heartbeat = "off" # (default)

[crew.aide]
policy = "per-item"
keep_context = false
stop_after = "never"
subagents = false
# heartbeat = "off" # (default)

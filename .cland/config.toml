# managed by cland 0.1.0 — cland update rewrites this file and keeps the values below; remove this line to take it over.
# The project's cland settings (spec 4.9). Committed.

[project]
name = "v0"

[verification]
# Admission budget; the legacy compatibility lease remains an additional limit.
budget = 1
# D27 set 2 for the v0.1.2 build; the human raised it to 4 on 2026-10-15 (ask 35ca68c2), within the same $3 daily cap.
remote_budget = 4
lock_path = "/tmp/cland-suite.lock"
# Reuse green candidate trees for this many minutes; 0 disables caching.
cache_max_age_minutes = 1440
# D27 build values (stand-in under D24, 2026-10-13): the hub enforces these for droplet runs.
# The documented defaults are 110m, 75m and $5.
# D28 (human, 2026-10-14): verification runs on droplets from the hub restart after T-347.
executor = "droplet"
lifetime = "60m"
run_timeout = "50m"
daily_spend_usd = 3

[sessions]
# Archive stopped crew after their item closes, otherwise after their stop. Aides are excluded.
archive_after_item = "3600s"
archive_after_stop = "86400s"

# Container kinds, ordered top-down; a list at a level groups peers. The first kind owns releases.
# Other root kinds (category by default) have no version or rank. Leaves and map are outside the ladder.
[tracker]
levels = [["release","category"],"epic"]

[plan]
approval = "none"
# QA for tasks outside any plan. Review is always required.
qa_default = { scope = "none", when = "per-item" }

# Keyboard layouts for Neovim Normal-mode letters (currently: ru). Ctrl focus chords use English.
[keys]
layouts = ["ru"]

# The hub's message hygiene, read at hub start (cland hub stop, then start, to apply a change).
[hygiene]
# messages one session may send to other sessions within the window
rate_limit_max = 30
rate_limit_window_minutes = 10
# events delivered to one session within their own window
event_limit_max = 120
event_limit_window_minutes = 10
# messages between one pair of sessions within the window before the pair is muted, and for how long
loop_breaker_max = 20
loop_breaker_window_minutes = 5
loop_breaker_mute_minutes = 10
# the largest message text, in bytes
max_text_bytes = 8192

# Archived artifact files are removed after this many days; their index entries stay.
[artifacts]
retention_days = 30

# Surface.kind = layer (now, watch, background, archive); read at hub start.
[visibility]


# managed by cland 0.2.0 — cland update rewrites this file and keeps the values below; remove this line to take it over.
# The project's cland settings (spec 4.9). Committed.

[project]
name = "v0"

[release.homebrew]
# Optional existing GitHub tap; empty disables formula publication.
tap = "Kealman/homebrew-tap"

[publish]
# Exact paths or directory/** prefixes eligible for out-of-release publication.
allow_paths = ["site/**","docs/brand/**","README.md","LICENSE",".github/workflows/pages.yml"]

[setup]
# Missing harnesses declined in setup; --install <harness> runs their installer.
declined_installs = []
# Accounts declined in setup; add them to the machine-wide registry by hand to use them.
declined_accounts = []

[verification]
# cland verify runs nothing until test or a tier command is set; use cland config set verification.test '<command>'.
# prepare installs what check and test need; runs on the droplet builder and before every droplet run, never locally.
# Commands run under /bin/sh -c; prepare must be idempotent and write only ignored files.
prepare = "node hub/bin/verify-prepare.ts"
# check is the fast gate; runs first and on the host before a droplet is made.
check = "npm run check"
# test is the suite; its exit code decides the run.
test = "npm test"
# test_unit runs per task, in merge batches and at occasions (T1).
test_unit = "node hub/test/run-suite.ts --tier T1"
# test_component runs per task and at occasions (T2).
test_component = "node hub/test/run-suite.ts --tier T2"
# test_integration runs in T3-enabled batches, periodic dev checks and at occasions (T3).
test_integration = "node hub/test/run-suite.ts --tier T3"
# test_soak runs at occasions and in the nightly soak (T4).
test_soak = "node hub/test/run-suite.ts --tier T4"
executor = "droplet"
# Allow default droplet requests to use the local slot when remote is unavailable.
local_fallback = false
# Concurrent machine test files; the free shard always uses one worker.
workers = 4
# Extra load-gate lanes; repetitions of one new test stay sequential.
load_gate_workers = 2
# Local admission stays capped at one, behind the compatibility leases.
budget = 1
# Parallel droplet runs beside the local slot.
remote_budget = 6
shards = 2
lock_path = "/tmp/cland-suite.lock"
# Reuse green candidate trees for this many minutes; 0 disables caching.
cache_max_age_minutes = 1440
# Queue wait p90 target; informational, without changing admission.
wait_p90_target = "20m"
# Report function coverage older than this; mapped ancestor hunks still select.
coverage_max_age = "172800s"
# Newest coverage pointers to keep; artifact retention is independent.
coverage_map_retention = 10
# Named tests fail at this deadline; silent commands are stopped with their process tree.
test_timeout = "120s"
stall_timeout = "600s"
lifetime = "90m"

run_timeout = "75m"
daily_spend_usd = 14
# Nightly UTC time (HH:MM); empty disables the droplet soak.
soak = "03:00"
# Periodic dev T3 interval; runs only when the verification candidate tree changed; empty disables it.
dev_t3_every = "2h"

[verification.droplet]
workers = 2
size = "c-8"
prepare_size = "c-8"
regions = ["lon1","fra1","ams3","nyc1","sfo2","blr1"]
image = "ubuntu-24-04-x64"

[merge]
# Queue reviewed code heads for batch landing. Documentation and human overrides land immediately.
queue = true
# Maximum reviewed heads in one batch.
batch = 3
batch_tiers = ["T1"]
# Start a partial batch after this wait from its oldest request.
batch_wait = "120s"

[sessions]
# Archive stopped crew after their item closes, otherwise after their stop. Aides are excluded.
archive_after_item = "3600s"
archive_after_stop = "86400s"

# Container kinds, ordered top-down; a list at a level groups peers. The first kind owns releases.
# Other root kinds (category by default) have no version or rank. Leaves and map are outside the ladder.
[tracker]
levels = [["release","category"],"epic"]
# Warn after 5 seconds; exit only if the same operation is still outstanding at this deadline.
# Maximum: 2147483s (the platform timer limit).
fatal_stall = "60s"

[plan]
approval = "none"
# QA for tasks outside any plan. Review is always required.
qa_default = { scope = "none", when = "per-item" }

# Keyboard layouts for Neovim Normal-mode letters (currently: ru). Ctrl focus chords use English.
[keys]
layouts = ["ru"]

# The hub's message hygiene, read at hub start (cland hub stop, then start, to apply a change).
[hygiene]
# messages one session may send to other sessions within the window
rate_limit_max = 30
rate_limit_window_minutes = 10
# events delivered to one session within their own window
event_limit_max = 120
event_limit_window_minutes = 10
# messages between one pair of sessions within the window before the pair is muted, and for how long
loop_breaker_max = 20
loop_breaker_window_minutes = 5
loop_breaker_mute_minutes = 10
# the largest message text, in bytes
max_text_bytes = 8192

# The browser listener defaults to loopback. Changes apply after a hub restart.
[web]
# Only the web edge uses this address; the spokes stay on loopback.
bind = "127.0.0.1"
# Optional HTTPS tunnel origin; forwarded headers are never trusted.
origin = ""
# 0 keeps the first free port in .cland/web-port; a taken port disables only this edge.
port = 0
# Empty serves the installed web/dist; a development bundle path is relative to the project root.
dist = ""

# Archived artifact files are removed after this many days; their index entries stay.
[artifacts]
retention_days = 30

# Surface.kind = layer (now, watch, background, archive); read at hub start.
[visibility]


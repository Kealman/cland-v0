# Builds site/ (cland.app) and deploys it to GitHub Pages.
# main deploys on release; the site branch deploys between releases.
name: Pages

on:
  push:
    branches: [main, site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tells IndexNow engines (Bing, which feeds Copilot and ChatGPT search, Yandex and
  # others) about every page after a deploy. The key file lives in site/public/.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow
        run: |
          KEY=6110d1e563bf6b6bf9d9599630a15f52
          URLS=$(curl -fsSL https://cland.app/sitemap-0.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          BODY=$(jq -nc --arg key "$KEY" --argjson urls "$URLS" \
            '{host: "cland.app", key: $key, keyLocation: ("https://cland.app/" + $key + ".txt"), urlList: $urls}')
          curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$BODY"

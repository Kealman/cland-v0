# PROTOTYPE (ticket #11): config of the tmux server (socket "cland-proto")
# that owns sessions outside Neovim. Meant to be a transparent wrapper:
# no prefix key (nothing is taken from the harness), no status bar (the
# Neovim winbar names the session), no Esc delay.
set -g prefix None
unbind C-b
set -g status off
set -g escape-time 0
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
# "always": a Shift+Enter that Neovim maps to CSI 13;2u (:ClandShiftEnter csi-u)
# reaches the program; with "on" tmux 3.5a drops it for programs that ask
# for the kitty protocol, which it does not support (check b-7)
set -g extended-keys always
set -g extended-keys-format csi-u
